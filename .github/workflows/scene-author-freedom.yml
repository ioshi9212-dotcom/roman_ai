name: scene author freedom checks

on:
  push:
    branches: [refactor/skin-builder-author-freedom-20261012]
  pull_request:
    paths:
      - 'runtime/scene_builder.md'
      - 'runtime/rules.md'
      - 'app/narrative_guardrails_runtime.py'
      - 'gpt/custom_gpt_instructions.md'
      - 'tests/test_pov_activity_guardrail.py'
      - 'tests/test_narrative_guardrails_runtime.py'

jobs:
  scene-author-freedom:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Validate Python syntax
        run: python -m compileall -q app
      - name: Test runtime and POV activity
        run: >
          pytest -q
          tests/test_narrative_guardrails_runtime.py
          tests/test_pov_activity_guardrail.py
          tests/test_runtime_contract.py
          tests/test_rules_driven_runtime.py
          tests/test_npc_agency_contract.py
          tests/test_custom_gpt_surface.py
