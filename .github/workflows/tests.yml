name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  current-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest openapi-spec-validator
      - name: validate static OpenAPI
        run: openapi-spec-validator openapi.yaml
      - name: current runtime tests
        run: >
          pytest -q
          tests/test_rules_driven_runtime.py
          tests/test_prepare_turn_idempotency.py
          tests/test_safe_chunk_transport.py
          tests/test_writer_first_transport.py
          tests/test_current_recovery.py
          tests/test_rollback_diagnostics.py
          tests/test_transactional_storage.py
          tests/test_memory_integrity_runtime.py
          tests/test_game_day.py
          tests/test_context_stats.py
          tests/test_context_stats_missing.py
          tests/test_context_stats_sizes.py
          tests/test_character_chunk_read.py
          tests/test_cast_registry_and_intake.py
          tests/test_cast_registry_integration.py
          tests/test_setup_flow.py
          tests/test_setup_draft_v3.py
          tests/test_setup_lossless_v4.py
          tests/test_profile_templates.py
          tests/test_simple_profile_flow.py::test_finalized_source_keeps_verbatim_trigger_without_bloating_gameplay
          tests/test_simple_profile_flow.py::test_v5_reviewed_raw_can_accept_more_blocks_and_finalize
          tests/test_simple_profile_flow.py::test_legacy_raw_validation_stays_strict_without_profile_mode
          tests/test_location_profiles_runtime.py
          tests/test_npc_intent_runtime.py
          tests/test_custom_gpt_surface.py
          tests/test_hidden_direct_character_actions.py
          tests/test_remote_scene_state.py
          tests/test_npc_relationship_network.py
          tests/test_scene_density_starting_relationships.py
          tests/test_relationship_antifreeze_hybrid.py
          tests/test_session_schema_migrations.py
          tests/test_persistent_story_npc_registration.py
          tests/test_personal_memory_identity_boundary.py
          tests/test_scene_npc_knowledge_guard.py
          tests/test_commit_idempotency.py
          tests/test_61_turn_cycle.py
          tests/test_300_turn_longevity.py
          tests/test_audit_snapshot_compact.py
          tests/test_scene_audit_compaction.py
          tests/test_long_horizon_audit.py
          tests/test_consolidated_memory_compaction.py
          tests/test_consolidated_chronology_anchors.py
          tests/test_character_read_longevity.py
          tests/test_lightweight_engine_mechanics.py
          tests/test_session_checkpoint_failure_recovery.py
          tests/test_last_turn_rollback.py
          --junitxml=pytest-current-report.xml
      - name: upload current report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-current-report
          path: pytest-current-report.xml

  legacy-reference:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: old full suite for reference
        run: pytest -q --junitxml=pytest-legacy-report.xml
      - name: upload legacy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-legacy-report
          path: pytest-legacy-report.xml
