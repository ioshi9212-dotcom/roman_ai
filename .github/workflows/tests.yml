name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  current-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest openapi-spec-validator
      - name: validate static OpenAPI
        run: openapi-spec-validator openapi.yaml
      - name: current runtime tests
        run: >
          pytest -q
          tests/test_rules_driven_runtime.py
          tests/test_prepare_turn_idempotency.py
          tests/test_writer_first_transport.py
          tests/test_current_recovery.py
          tests/test_rollback_diagnostics.py
          tests/test_transactional_storage.py
          tests/test_memory_integrity_runtime.py
          tests/test_game_day.py
          tests/test_context_stats.py
          tests/test_context_stats_missing.py
          tests/test_context_stats_sizes.py
          tests/test_character_chunk_read.py
          tests/test_cast_registry_and_intake.py
          tests/test_cast_registry_integration.py
          tests/test_setup_flow.py
          tests/test_setup_draft_v3.py
          tests/test_setup_lossless_v4.py
          tests/test_profile_templates.py
          tests/test_location_profiles_runtime.py
          tests/test_npc_intent_runtime.py
          tests/test_custom_gpt_surface.py
          tests/test_hidden_direct_character_actions.py
          tests/test_remote_scene_state.py
          --junitxml=pytest-current-report.xml
      - name: upload current report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-current-report
          path: pytest-current-report.xml

  legacy-reference:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: old full suite for reference
        run: pytest -q --junitxml=pytest-legacy-report.xml
      - name: upload legacy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-legacy-report
          path: pytest-legacy-report.xml
