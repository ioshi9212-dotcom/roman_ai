openapi: 3.1.0
info:
  title: Roman AI
  version: 1.10.0
  description: Persistent isolated novel sessions with bounded writer-first context, transactional memory, living NPC relationships, NPC intents, story threads, recovery, rollback and fast 15-turn audits.
servers:
  - url: https://romanai-production-0fdb.up.railway.app
components:
  schemas:
    NovelDraftCreate:
      type: object
      required: [novel_id, title]
      properties:
        novel_id: {type: string}
        title: {type: string}
        version: {type: integer, default: 1}
    NovelDraftSection:
      type: object
      required: [section_name, section_json]
      properties:
        section_name:
          type: string
          enum: [novel, characters, lore, rules, hidden_lore, world, starting_state, story_direction, foundation]
        section_json: {type: string}
    SessionCreate:
      type: object
      required: [novel_id]
      properties:
        novel_id: {type: string}
    TurnPrepare:
      type: object
      required: [user_input]
      properties:
        user_input: {type: string}
    RollbackLastTurn:
      type: object
      required: [expected_turn_number, confirm]
      properties:
        expected_turn_number: {type: integer, minimum: 1}
        confirm: {type: boolean, const: true}
      additionalProperties: false
    PresenceUpdate:
      type: object
      required: [character_id, action]
      properties:
        character_id: {type: string}
        action:
          type: string
          enum: [enter, leave, move]
        zone: {type: string}
        position: {type: string}
        distance_to_pov: {type: string}
        note: {type: string}
      additionalProperties: false
    RelationshipDimensionUpdate:
      type: object
      required: [label, value]
      properties:
        label: {type: string}
        value: {type: number}
        delta: {type: number}
      additionalProperties: false
    RelationshipUpdate:
      type: object
      required: [character_id]
      properties:
        character_id: {type: string}
        dimensions:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RelationshipDimensionUpdate'}
        opinion: {type: string}
        current_dynamic: {type: string}
        beliefs_about_target:
          type: array
          items: {}
        unresolved_between_them:
          type: array
          items: {}
        relationship_type: {type: string}
        relationship_context: {type: string}
      additionalProperties: false
    NPCIntentUpdate:
      type: object
      required: [character_id, intent_id]
      properties:
        character_id: {type: string}
        intent_id: {type: string}
        operation:
          type: string
          enum: [upsert, resolve, abandon]
        kind: {type: string}
        summary: {type: string}
        status: {type: string}
        priority: {}
        trigger: {type: string}
        why_it_matters: {type: string}
        planned_action: {type: string}
        target_character_id: {type: string}
        source_fact_ids:
          type: array
          items: {type: string}
        next_eligible_game_day: {type: integer, minimum: 0}
        pursued_now: {type: boolean}
        resolution: {type: string}
      additionalProperties: true
    StoryThreadUpdate:
      type: object
      required: [thread_id]
      properties:
        thread_id: {type: string}
        operation:
          type: string
          enum: [upsert, resolve, abandon]
        title: {type: string}
        summary: {type: string}
        status: {type: string}
        priority: {}
        premise: {type: string}
        current_goal: {type: string}
        current_phase: {type: string}
        unresolved:
          type: array
          items: {}
        end_conditions:
          type: array
          items: {}
        possible_routes:
          type: array
          items: {}
        anchor_facts:
          type: array
          items: {}
        pillar_ids:
          type: array
          items: {type: string}
        participants:
          type: array
          items: {type: string}
        next_eligible_game_day: {type: integer, minimum: 0}
        progressed_now: {type: boolean}
        progress_summary: {type: string}
        resolution: {type: string}
      additionalProperties: true
    TurnCommit:
      type: object
      required: [user_input, scene_output, extracted]
      properties:
        user_input: {type: string}
        scene_output: {type: string}
        extracted:
          type: object
          required: [persistence_reviewed, chronology, knowledge_add, experiences_add, dialogue_memory_add, npc_intent_updates, story_thread_updates]
          properties:
            persistence_reviewed: {type: boolean}
            chronology:
              type: array
              items: {type: object, additionalProperties: true}
            knowledge_add:
              type: array
              items: {type: object, additionalProperties: true}
            experiences_add:
              type: array
              items: {type: object, additionalProperties: true}
            dialogue_memory_add:
              type: array
              items: {type: object, additionalProperties: true}
            npc_intent_updates:
              type: array
              description: Durable NPC-owned follow-ups, suspicions, promises, investigations, plans or blocked goals; use empty array when none changed.
              items: {$ref: '#/components/schemas/NPCIntentUpdate'}
            story_thread_updates:
              type: array
              description: Persistent lifecycle updates for live bounded plot events. Use empty array after review when no thread changed.
              items: {$ref: '#/components/schemas/StoryThreadUpdate'}
            presence_updates:
              type: array
              description: Explicit scene transitions. Omission preserves the start roster; only leave removes a present character.
              items: {$ref: '#/components/schemas/PresenceUpdate'}
            relationship_updates:
              type: array
              description: Persist an NPC opinion/beliefs/unresolved dynamic when it changed; dimensions are used only when a participating NPC is absent at scene end.
              items: {$ref: '#/components/schemas/RelationshipUpdate'}
            state_patch: {type: object, additionalProperties: true}
            character_upserts:
              type: array
              items: {type: object, additionalProperties: true}
          additionalProperties: true
    AuditCommit:
      type: object
      required: [start_turn, end_turn]
      properties:
        start_turn: {type: integer}
        end_turn: {type: integer}
        repairs: {type: object, additionalProperties: true}
        notes:
          type: array
          items: {type: string}
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200': {description: Healthy}
  /runtime:
    get:
      operationId: getRuntime
      summary: Prepare the complete setup-time runtime documents as safe chunks
      description: Returns a manifest. During new-novel setup read every getRuntimeChunk from 0 through chunk_count-1.
      responses:
        '200': {description: Runtime chunk manifest}
  /runtime/{chunk_index}:
    get:
      operationId: getRuntimeChunk
      summary: Read one setup-time runtime chunk
      parameters:
        - {in: path, name: chunk_index, required: true, schema: {type: integer}}
      responses:
        '200': {description: One runtime chunk}
        '404': {description: Chunk index out of range}
  /novel-drafts:
    post:
      operationId: createNovelDraft
      summary: Start a staged session-only draft for a new novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftCreate'}
      responses:
        '200': {description: Draft status with draft_id}
  /novel-drafts/{draft_id}/sections:
    post:
      operationId: saveNovelDraftSection
      summary: Save or replace one complete draft section
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftSection'}
      responses:
        '200': {description: Updated draft status}
  /novel-drafts/{draft_id}:
    get:
      operationId: getNovelDraftStatus
      summary: Check saved sections and finalized state
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft status}
  /novel-drafts/{draft_id}/finalize:
    post:
      operationId: finalizeNovelDraft
      summary: Verify and freeze a session-only draft
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Verification summary}
  /novel-drafts/{draft_id}/read:
    post:
      operationId: prepareDraftRead
      summary: Prepare chunked reading of a finalized draft
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: read_id, chunk_count and total_chars}
  /novel-drafts/{draft_id}/session:
    post:
      operationId: createSessionFromDraft
      summary: Create an isolated session from a finalized draft
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Session metadata}
  /novel-drafts/{draft_id}/publish:
    post:
      operationId: saveDraftToLibrary
      summary: Explicitly publish a finalized draft to the reusable library
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft published}
  /novels:
    get:
      operationId: listNovels
      summary: List reusable library novels
      responses:
        '200': {description: Novel list}
  /novels/{novel_id}/read:
    post:
      operationId: prepareNovelRead
      summary: Prepare chunked reading of a library novel
      parameters:
        - {in: path, name: novel_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Prepared read}
  /novel-reads/{read_id}/{chunk_index}:
    get:
      operationId: getNovelReadChunk
      summary: Read one chunk from a prepared draft or library read
      parameters:
        - {in: path, name: read_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer}}
      responses:
        '200': {description: One chunk}
  /sessions:
    post:
      operationId: createSession
      summary: Create an isolated session from a library novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '200': {description: Session metadata}
  /sessions/{session_id}/preview:
    get:
      operationId: getSessionPreview
      summary: Build a compact preview from an existing session
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Session preview}
  /sessions/{session_id}/resume:
    post:
      operationId: resumeSession
      summary: Reconnect to the exact existing session
      description: Compact checkpoint only. If current_recovery_required=true, call recoverSessionCurrent before prepareTurn. Complete canon remains in Railway.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Same-session compact checkpoint with recovery status}
        '404': {description: Session not found}
  /sessions/{session_id}/recover-current:
    post:
      operationId: recoverSessionCurrent
      summary: Repair only the technical current scene pointer without creating a gameplay turn
      description: Repairs damaged state.current from saved evidence without creating a turn or changing prior turns, chronology, memory, or source.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Technical current pointer repaired or already usable}
        '404': {description: Session not found}
        '409': {description: Not enough persistent evidence to repair safely}
  /sessions/{session_id}/rollback-last-turn:
    post:
      operationId: rollbackLastTurn
      summary: Roll back only the latest saved canonical turn after explicit user request
      description: Requires the exact current turn number and confirm=true. Restores persistent canon transactionally or refuses without mutation.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackLastTurn'}
      responses:
        '200': {description: Latest turn rolled back and same turn number is ready to retry}
        '404': {description: Session not found}
        '409': {description: Confirmation, expected turn or exact reconstruction check failed; no mutation performed}
  /sessions/{session_id}/audit-snapshot:
    get:
      operationId: getAuditSnapshot
      summary: Prepare a fast 15-turn persisted audit backup
      description: Visible committed chat scenes are primary evidence. Response includes audit chunk 0 when first_chunk_included=true; do not fetch chunk 0 again.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Fast audit manifest plus inline chunk 0 when available}
        '409': {description: Audit is not currently required}
  /sessions/{session_id}/audit-snapshot/{audit_id}/{chunk_index}:
    get:
      operationId: getAuditSnapshotChunk
      summary: Read one remaining fast-audit chunk
      description: If getAuditSnapshot included chunk 0, start at next_chunk_index and read only remaining indices. Do not batch Action responses.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: audit_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: One remaining audit chunk}
        '403': {description: Invalid or stale audit_id}
        '404': {description: Chunk index out of range}
  /sessions/{session_id}/turn-packet:
    post:
      operationId: prepareTurn
      summary: Build or reuse bounded writer-first context from complete persistent canon
      description: New packet response includes chunk 0 when first_chunk_included=true. Repeating the same pending user_input reuses the packet; never create a duplicate turn.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnPrepare'}
      responses:
        '200': {description: Writer-first manifest plus inline chunk 0 when a new packet was prepared}
        '409': {description: Audit required or current scene pointer requires technical recovery}
  /sessions/{session_id}/turn-packet/{packet_id}/{chunk_index}:
    get:
      operationId: getTurnPacketChunk
      summary: Read one remaining writer-first packet chunk
      description: When prepareTurn included chunk 0, start at next_chunk_index and read only remaining indices. Do not batch Action responses.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: packet_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: One remaining writer packet chunk}
        '403': {description: Invalid or stale packet_id}
        '404': {description: Chunk index out of range}
  /sessions/{session_id}/characters/{character_id}/read:
    post:
      operationId: prepareCharacterBundleRead
      summary: Prepare one bounded offscreen participation dossier
      description: Returns the full card plus bounded personal memory, relationship and active intents. Chunk 0 is included when first_chunk_included=true; complete lifetime memory remains persistent.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Character participation manifest plus inline chunk 0}
        '404': {description: Session or character not found}
  /sessions/{session_id}/characters/{character_id}/read/{read_id}/{chunk_index}:
    get:
      operationId: getCharacterBundleChunk
      summary: Read one remaining bounded character participation chunk
      description: When prepareCharacterBundleRead included chunk 0, start at next_chunk_index. If the dossier changes during reading, restart the prepared read.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
        - {in: path, name: read_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: One remaining bounded character participation chunk}
        '404': {description: Session, character or chunk not found}
        '409': {description: Character dossier changed during reading}
  /sessions/{session_id}/turns:
    get:
      operationId: getTurnRange
      summary: Emergency recovery or manual diagnostics only
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: start_turn, required: true, schema: {type: integer}}
        - {in: query, name: end_turn, required: true, schema: {type: integer}}
      responses:
        '200': {description: Raw turns}
    post:
      operationId: commitTurn
      summary: Save one complete turn after required writer chunks were read
      description: Transactionally persists turn, state, cards, personal memory, chronology, relationships, NPC intents and persistent story-thread state. After three consecutive static turns a fourth static commit is rejected.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnCommit'}
      responses:
        '200': {description: Turn committed}
        '409': {description: Audit, packet reading, persistence review, relationship, presence, knowledge, current-state or story-progress validation incomplete}
  /sessions/{session_id}/audit:
    post:
      operationId: commitAudit
      summary: Finish one fast 15-turn reconciliation after required audit chunks were read
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditCommit'}
      responses:
        '200': {description: Audit committed}
        '409': {description: Audit manifest/chunk reading incomplete or audit range mismatch}