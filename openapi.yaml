openapi: 3.1.0
info:
  title: Roman AI
  version: 1.5.0
  description: Persistent isolated novel sessions. Existing sessions continue directly by session_id across chats; no transfer package or resume chunks are used.
servers:
  - url: https://romanai-production-0fdb.up.railway.app
components:
  schemas:
    NovelDraftCreate:
      type: object
      required: [novel_id, title]
      properties:
        novel_id: {type: string}
        title: {type: string}
        version: {type: integer, default: 1}
    NovelDraftSection:
      type: object
      required: [section_name, section_json]
      properties:
        section_name:
          type: string
          enum: [novel, characters, lore, rules, hidden_lore, world, starting_state, story_direction]
        section_json: {type: string}
    SessionCreate:
      type: object
      required: [novel_id]
      properties:
        novel_id: {type: string}
    TurnPrepare:
      type: object
      required: [user_input]
      properties:
        user_input: {type: string}
    TurnCommit:
      type: object
      required: [user_input, scene_output]
      properties:
        user_input: {type: string}
        scene_output: {type: string}
        extracted:
          type: object
          additionalProperties: true
          description: Persistent changes. May include state_patch, chronology, knowledge_add, experiences_add, dialogue_memory_add and character_upserts.
    AuditCommit:
      type: object
      required: [start_turn, end_turn]
      properties:
        start_turn: {type: integer}
        end_turn: {type: integer}
        repairs: {type: object, additionalProperties: true}
        notes:
          type: array
          items: {type: string}
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200': {description: Healthy}
  /runtime:
    get:
      operationId: getRuntime
      summary: Load runtime rules including continuity and knowledge contracts
      responses:
        '200': {description: Runtime documents}
  /novel-drafts:
    post:
      operationId: createNovelDraft
      summary: Start a staged session-only draft for a new novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftCreate'}
      responses:
        '200': {description: Draft status with draft_id}
  /novel-drafts/{draft_id}/sections:
    post:
      operationId: saveNovelDraftSection
      summary: Save or replace one complete draft section
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftSection'}
      responses:
        '200': {description: Updated draft status}
  /novel-drafts/{draft_id}:
    get:
      operationId: getNovelDraftStatus
      summary: Check saved sections and finalized state
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft status}
  /novel-drafts/{draft_id}/finalize:
    post:
      operationId: finalizeNovelDraft
      summary: Verify and freeze a session-only draft without adding it to the library
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Compact verification summary}
  /novel-drafts/{draft_id}/read:
    post:
      operationId: prepareDraftRead
      summary: Prepare chunked reading of a finalized draft
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: read_id, chunk_count and total_chars}
  /novel-drafts/{draft_id}/session:
    post:
      operationId: createSessionFromDraft
      summary: Create an isolated session directly from a finalized draft
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Session metadata with session_id}
  /novel-drafts/{draft_id}/publish:
    post:
      operationId: saveDraftToLibrary
      summary: Explicitly publish a finalized draft to the reusable library
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft published to library}
  /novels:
    get:
      operationId: listNovels
      summary: List explicitly saved reusable library novels
      responses:
        '200': {description: Novel list}
  /novels/{novel_id}/read:
    post:
      operationId: prepareNovelRead
      summary: Prepare chunked reading of a library novel
      parameters:
        - {in: path, name: novel_id, required: true, schema: {type: string}}
      responses:
        '200': {description: read_id, chunk_count and total_chars}
  /novel-reads/{read_id}/{chunk_index}:
    get:
      operationId: getNovelReadChunk
      summary: Read one chunk from a prepared draft or library read
      parameters:
        - {in: path, name: read_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer}}
      responses:
        '200': {description: One chunk and all_chunks_read flag}
  /sessions:
    post:
      operationId: createSession
      summary: Create an isolated session from an existing library novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '200': {description: Session metadata with session_id}
  /sessions/{session_id}/preview:
    get:
      operationId: getSessionPreview
      summary: Build a compact preview from an actually created session
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Stored session preview}
  /sessions/{session_id}/resume:
    post:
      operationId: resumeSession
      summary: Reconnect to this exact existing session without copying or transferring it
      description: Returns a compact checkpoint and live character registry. On the next gameplay input call prepareTurn for this same session_id.
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Compact same-session checkpoint with character_registry}
        '404': {description: Session not found}
  /sessions/{session_id}/audit-snapshot:
    get:
      operationId: getAuditSnapshot
      summary: Get compact saved data for the current 15-turn audit
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Current state plus chronology and memory saved during this audit cycle}
  /sessions/{session_id}/turn-packet:
    post:
      operationId: prepareTurn
      summary: Build chunked authoritative context for the next turn, including live character registry and POV familiarity
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnPrepare'}
      responses:
        '200': {description: Packet manifest}
  /sessions/{session_id}/turn-packet/{packet_id}/{chunk_index}:
    get:
      operationId: getTurnPacketChunk
      summary: Read one required context chunk
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: packet_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer}}
      responses:
        '200': {description: One packet chunk}
  /sessions/{session_id}/characters/{character_id}:
    get:
      operationId: getCharacterBundle
      summary: Load full card, current state, POV familiarity, personal memory and relationship-to-POV for one registered character
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Full character bundle}
  /sessions/{session_id}/characters/{character_id}/memory:
    get:
      operationId: getCharacterMemory
      summary: Load one character memory directly for diagnostics or recovery
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Character memory}
  /sessions/{session_id}/turns:
    get:
      operationId: getTurnRange
      summary: Emergency recovery or manual diagnostics only
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: start_turn, required: true, schema: {type: integer}}
        - {in: query, name: end_turn, required: true, schema: {type: integer}}
      responses:
        '200': {description: Raw turns}
    post:
      operationId: commitTurn
      summary: Save one complete turn after every packet chunk was read
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnCommit'}
      responses:
        '200': {description: Turn committed}
  /sessions/{session_id}/audit:
    post:
      operationId: commitAudit
      summary: Finish the mandatory 15-turn audit with one repair commit
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditCommit'}
      responses:
        '200': {description: Audit committed}
