openapi: 3.1.0
info:
  title: Roman AI
  version: 1.0.0
  description: Persistent novel sessions for Custom GPT.
servers:
  - url: https://romanai-production-0fdb.up.railway.app
components:
  schemas:
    NovelDraftCreate:
      type: object
      required: [novel_id, title]
      properties:
        novel_id: {type: string}
        title: {type: string}
        version: {type: integer, default: 1}
    NovelDraftSection:
      type: object
      required: [section_name, section_json]
      properties:
        section_name:
          type: string
          enum: [novel, characters, lore, rules, hidden_lore, world, starting_state, story_direction]
        section_json:
          type: string
          description: Exactly one valid JSON value for this section, with no prose before or after it.
    NovelTemplate:
      type: object
      required: [novel_id, title]
      properties:
        novel_id: {type: string}
        title: {type: string}
        version: {type: integer, default: 1}
        novel: {type: object, additionalProperties: true}
        characters:
          type: array
          items: {type: object, additionalProperties: true}
        lore: {type: object, additionalProperties: true}
    NovelRawSave:
      type: object
      required: [template_json]
      properties:
        template_json: {type: string}
    SessionCreate:
      type: object
      required: [novel_id]
      properties:
        novel_id: {type: string}
    TurnPrepare:
      type: object
      required: [user_input]
      properties:
        user_input: {type: string}
    TurnCommit:
      type: object
      required: [user_input, scene_output]
      properties:
        user_input: {type: string}
        scene_output: {type: string}
        extracted:
          type: object
          additionalProperties: true
          description: Persistent changes. May include state_patch, chronology, knowledge_add, experiences_add, dialogue_memory_add and character_upserts.
    AuditCommit:
      type: object
      required: [start_turn, end_turn]
      properties:
        start_turn: {type: integer}
        end_turn: {type: integer}
        repairs: {type: object, additionalProperties: true}
        notes:
          type: array
          items: {type: string}
    ResumeConfirm:
      type: object
      required: [resume_token]
      properties:
        resume_token: {type: string}
paths:
  /health:
    get:
      operationId: health
      summary: Check service health
      responses:
        '200': {description: Healthy}
  /runtime:
    get:
      operationId: getRuntime
      summary: Load runtime rules, scene builder and memory contract
      responses:
        '200': {description: Runtime documents}
  /novel-drafts:
    post:
      operationId: createNovelDraft
      summary: Start a staged draft for a new library novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftCreate'}
      responses:
        '200': {description: Draft status with draft_id}
  /novel-drafts/{draft_id}/sections:
    post:
      operationId: saveNovelDraftSection
      summary: Save or replace one complete novel section
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelDraftSection'}
      responses:
        '200': {description: Updated draft status}
  /novel-drafts/{draft_id}:
    get:
      operationId: getNovelDraftStatus
      summary: Check which sections are saved and whether draft is complete
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Draft status}
  /novel-drafts/{draft_id}/finalize:
    post:
      operationId: finalizeNovelDraft
      summary: Validate staged draft and save it into the permanent library
      parameters:
        - {in: path, name: draft_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Finalized novel with verification summary}
  /novels:
    get:
      operationId: listNovels
      summary: List library novels
      responses:
        '200': {description: Novel list}
    post:
      operationId: saveNovel
      summary: Save a simple structured novel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelTemplate'}
      responses:
        '200': {description: Saved novel}
  /novels/raw:
    post:
      operationId: saveNovelRaw
      summary: Legacy one-shot save for small templates only; do not use for full novels
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NovelRawSave'}
      responses:
        '200': {description: Saved novel}
  /novels/{novel_id}:
    get:
      operationId: getNovel
      summary: Load one library novel
      parameters:
        - {in: path, name: novel_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Novel}
  /sessions:
    post:
      operationId: createSession
      summary: Create isolated session from a library snapshot and initialize starting state, cards and memory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '200': {description: Session metadata}
  /sessions/{session_id}:
    get:
      operationId: getSession
      summary: Load current session snapshot including live character cards
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Session snapshot}
  /sessions/{session_id}/audit-snapshot:
    get:
      operationId: getAuditSnapshot
      summary: Get compact saved data for the current 15-turn audit without reloading raw scenes
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Current state plus chronology and memory saved during this audit cycle}
        '409': {description: Audit not required}
  /sessions/{session_id}/turn-packet:
    post:
      operationId: prepareTurn
      summary: Build chunked context for the next user turn including full canon slices and compact cast index
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnPrepare'}
      responses:
        '200': {description: Packet manifest}
  /sessions/{session_id}/turn-packet/{packet_id}/{chunk_index}:
    get:
      operationId: getTurnPacketChunk
      summary: Read one required context chunk
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: packet_id, required: true, schema: {type: string}}
        - {in: path, name: chunk_index, required: true, schema: {type: integer}}
      responses:
        '200': {description: One packet chunk}
  /sessions/{session_id}/characters/{character_id}:
    get:
      operationId: getCharacterBundle
      summary: Load full card, current state, personal memory and relationship for one known character before bringing them into a scene
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Full character bundle}
        '404': {description: Session or character not found}
  /sessions/{session_id}/characters/{character_id}/memory:
    get:
      operationId: getCharacterMemory
      summary: Load one character memory directly for debugging or recovery
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: path, name: character_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Character memory}
  /sessions/{session_id}/turns:
    get:
      operationId: getTurnRange
      summary: Emergency recovery or manual diagnostics only; do not use for normal 15-turn audit
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
        - {in: query, name: start_turn, required: true, schema: {type: integer}}
        - {in: query, name: end_turn, required: true, schema: {type: integer}}
      responses:
        '200': {description: Raw turns}
    post:
      operationId: commitTurn
      summary: Save one complete turn after every packet chunk was read
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TurnCommit'}
      responses:
        '200': {description: Turn committed}
  /sessions/{session_id}/audit:
    post:
      operationId: commitAudit
      summary: Finish the fast mandatory 15-turn audit with one repair commit
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditCommit'}
      responses:
        '200': {description: Audit committed}
  /sessions/{session_id}/resume:
    post:
      operationId: resumeSession
      summary: Build transfer package after turn 60 including live cards and turns 55-60
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      responses:
        '200': {description: Resume package}
  /sessions/{session_id}/resume/confirm:
    post:
      operationId: confirmResume
      summary: Confirm successful transfer in the new chat
      parameters:
        - {in: path, name: session_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResumeConfirm'}
      responses:
        '200': {description: Transfer confirmed}
